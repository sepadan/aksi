    <div class="kandungan">
      <div class="halaman-header">

      <!-- Butang tambah & tapis -->

        <div class="form-row-2">

      <!-- Senarai Pencapaian -->
      <div class="kad">
        <h3 class="seksyen-tajuk">
          Senarai Pencapaian
          <span id="bilangan-rekod" 
                class="badge-bilangan"></span>
        </h3>
        <div id="senarai-pencapaian">
          <p class="tiada-data">Memuatkan...</p>

    <?!= include('Script') ?>
    <script>

      let senaraiPencapaianSemua = [];
      let senaraiKelab = [];
      let senaraiMuridPencapaian = null;
      let sedangMuatMuridPencapaian = false;

      document.addEventListener('DOMContentLoaded', function() {
        const token = semakSesiAktif();
        if (!token) return;

        const hari = new Date().toISOString().split('T')[0];
        document.getElementById('tambah-tarikh').value = hari;

        muatSenaraiGuru();
        muatPencapaian();
        muatSenaraiMuridPencapaian();
      });

      function muatSenaraiGuru() {
        google.script.run
          .withSuccessHandler(function(data) {
            const select = document.getElementById('tambah-guru');
            (data || []).forEach(g => {
              const opt = document.createElement('option');
              opt.value = g.nama;
              opt.textContent = g.nama;
              select.appendChild(opt);
            });
          })
          .withFailureHandler(function() {
            tunjukToast('Senarai guru tidak dapat dimuatkan.', 'ralat');
          })
          .getSenaraiGuru(sessionStorage.getItem('token'));
      }

      function muatPencapaian() {
        const peringkat = document.getElementById('tapis-peringkat')
                                  .value;
        tunjukLoading(true);

        google.script.run
          .withSuccessHandler(function(data) {
            tunjukLoading(false);
            senaraiPencapaianSemua = data || [];
            tapishPencapaian();
          })
          .withFailureHandler(function() {
            tunjukLoading(false);
            tunjukToast('Senarai pencapaian tidak dapat dimuatkan.', 'ralat');
          })
          .getSenaraiPencapaian(
            { peringkat: peringkat },
            sessionStorage.getItem('token')
          );
      }

      function tapishPencapaian() {
        const carian = document.getElementById('tapis-cari')
                               .value.toLowerCase();

        const data = senaraiPencapaianSemua.filter(p =>
          !carian ||
          String(p.namaMurid || '').toLowerCase()
            .includes(carian) ||
          String(p.ic || '').includes(carian) ||
          String(p.namaPertandingan || '').toLowerCase()
            .includes(carian)
        );

        document.getElementById('bilangan-rekod')
                .textContent = data.length + ' rekod';

        renderPencapaian(data);
      }

      function renderPencapaian(data) {
        const div = document.getElementById('senarai-pencapaian');
        div.replaceChildren();

        if (data.length === 0) {
          div.appendChild(ciptaElemen('p', 'tiada-data',
            'Tiada rekod pencapaian.'));
          return;
        }

        data.forEach(function(p) {
          const baris = ciptaElemen('div', 'pencapaian-baris');
          const kiri = ciptaElemen('div', 'pencapaian-kiri');
          const nama = ciptaElemen('div', 'pencapaian-nama');
          nama.appendChild(document.createTextNode(String(p.namaMurid || '') + ' '));
          nama.appendChild(ciptaElemen('span', 'kelas-badge', p.kelasMurid || ''));
          kiri.appendChild(nama);
          kiri.appendChild(ciptaElemen('div', 'pencapaian-pertandingan',
            p.namaPertandingan || ''));
          kiri.appendChild(ciptaElemen('div', 'pencapaian-meta',
            '📅 ' + formatTarikh(p.tarikh) + ' | 👨‍🏫 ' + (p.guruPengiring || '-')));

          const kanan = ciptaElemen('div', 'pencapaian-kanan');
          const kelasPeringkat = String(p.peringkat || '').toLowerCase()
            .replace(/[^a-z-]/g, '');
          kanan.appendChild(ciptaElemen('span',
            'badge-peringkat' + (kelasPeringkat ? ' ' + kelasPeringkat : ''),
            p.peringkat || '-'));
          kanan.appendChild(ciptaElemen('span', 'badge-tempat',
            '🏆 ' + (p.tempat || '-')));
          if (isAdmin()) {
            const padam = ciptaElemen('button', 'btn-padam', '🗑️');
            padam.type = 'button';
            padam.setAttribute('aria-label', 'Padam pencapaian');
            padam.addEventListener('click', function() {
              padamPencapaian(p.id, p.namaMurid || 'murid ini');
            });
            kanan.appendChild(padam);
          }
          baris.appendChild(kiri);
          baris.appendChild(kanan);
          div.appendChild(baris);
        });
      }

      function ciptaElemen(tag, kelas, teks) {
        const unsur = document.createElement(tag);
        if (kelas) unsur.className = kelas;
        if (teks !== undefined) unsur.textContent = String(teks);
        return unsur;
      }

      function paparMesejCariMurid(mesej, kelas) {
        const div = document.getElementById('hasil-cari-murid');
        div.replaceChildren(ciptaElemen('div',
          'dropdown-item tiada' + (kelas ? ' ' + kelas : ''), mesej));
      }

      function muatSenaraiMuridPencapaian() {
        if (senaraiMuridPencapaian || sedangMuatMuridPencapaian) return;
        sedangMuatMuridPencapaian = true;
        google.script.run
          .withSuccessHandler(function(data) {
            sedangMuatMuridPencapaian = false;
            senaraiMuridPencapaian = (data || []).filter(function(m) {
              return parseInt(m.tahun, 10) >= 3;
            });
            if (document.getElementById('cari-murid').value.trim().length >= 2) {
              cariMurid();
            }
          })
          .withFailureHandler(function() {
            sedangMuatMuridPencapaian = false;
            paparMesejCariMurid('Senarai murid gagal dimuatkan. Taip semula untuk cuba lagi.');
          })
          .getSenaraiMurid({ status: 'AKTIF' },
            sessionStorage.getItem('token'));
      }

      // Cari murid dalam senarai yang telah dimuat sekali sahaja.
      function cariMurid() {
        const input = document.getElementById('cari-murid');
        const carian = input.value.trim();
        const div = document.getElementById('hasil-cari-murid');

        if (carian.length < 2) {
          div.replaceChildren();
          return;
        }

        if (!senaraiMuridPencapaian) {
          paparMesejCariMurid('Memuatkan senarai murid…');
          muatSenaraiMuridPencapaian();
          return;
        }

        const q = carian.toLocaleLowerCase('ms-MY');
        const muridLayak = senaraiMuridPencapaian.filter(function(m) {
          return String(m.nama || '').toLocaleLowerCase('ms-MY').includes(q) ||
            String(m.ic || '').includes(carian);
        }).slice(0, 30);

        div.replaceChildren();
        if (!muridLayak.length) {
          paparMesejCariMurid('Tiada murid dijumpai.');
          return;
        }

        muridLayak.forEach(function(m) {
          const item = ciptaElemen('div', 'dropdown-item');
          item.tabIndex = 0;
          item.setAttribute('role', 'button');
          item.appendChild(ciptaElemen('strong', '', m.nama || ''));
          item.appendChild(ciptaElemen('span', '',
            (m.kelasLabel || '') + ' | ' + (m.ic || '')));
          const pilih = function() {
            pilihMurid(String(m.ic || ''), String(m.nama || ''),
              String(m.kelasLabel || ''));
          };
          item.addEventListener('click', pilih);
          item.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              pilih();
            }
          });
          div.appendChild(item);
        });
      }

      // ===== Murid dipilih (chip, boleh ramai) =====
      let muridPencapaian = [];
      let guruPencapaian = [];

      function renderChipMurid() {
        const div = document.getElementById('chip-murid');
        div.replaceChildren();
        muridPencapaian.forEach(function(m, i) {
          const chip = ciptaElemen('span', 'badge',
            m.nama + ' (' + m.kelas + ') ');
          chip.style.display = 'inline-flex';
          chip.style.alignItems = 'center';
          chip.style.gap = '6px';
          const buang = ciptaElemen('button', '', '✕');
          buang.type = 'button';
          buang.style.cssText = 'cursor:pointer;font-weight:bold;border:0;background:none';
          buang.setAttribute('aria-label', 'Buang murid');
          buang.addEventListener('click', function() { buangMuridPencapaian(i); });
          chip.appendChild(buang);
          div.appendChild(chip);
        });
      }

      function pilihMurid(ic, nama, kelas) {
        document.getElementById('cari-murid').value = '';
        document.getElementById('hasil-cari-murid').innerHTML = '';
        if (muridPencapaian.some(m => m.ic === ic)) {
          tunjukToast('Murid sudah dalam senarai.', 'ralat');
          return;
        }
        muridPencapaian.push({ ic: ic, nama: nama, kelas: kelas });
        renderChipMurid();
      }

      function buangMuridPencapaian(i) {
        muridPencapaian.splice(i, 1);
        renderChipMurid();
      }

      function renderChipGuruP() {
        const div = document.getElementById('chip-guru-pencapaian');
        div.replaceChildren();
        guruPencapaian.forEach(function(n, i) {
          const chip = ciptaElemen('span', 'badge', n + ' ');
          chip.style.display = 'inline-flex';
          chip.style.alignItems = 'center';
          chip.style.gap = '6px';
          const buang = ciptaElemen('button', '', '✕');
          buang.type = 'button';
          buang.style.cssText = 'cursor:pointer;font-weight:bold;border:0;background:none';
          buang.setAttribute('aria-label', 'Buang guru pengiring');
          buang.addEventListener('click', function() { buangGuruPencapaian(i); });
          chip.appendChild(buang);
          div.appendChild(chip);
        });
      }

      function tambahGuruPencapaian() {
        const sel = document.getElementById('tambah-guru');
        const nama = sel.value;
        if (!nama) return;
        if (guruPencapaian.includes(nama)) {
          tunjukToast('Guru sudah dalam senarai.', 'ralat');
          return;
        }
        guruPencapaian.push(nama);
        sel.value = '';
        renderChipGuruP();
      }

      function buangGuruPencapaian(i) {
        guruPencapaian.splice(i, 1);
        renderChipGuruP();
      }

      function batalPilihMurid() {
        muridPencapaian = [];
        guruPencapaian = [];
        renderChipMurid();
        renderChipGuruP();
        document.getElementById('cari-murid').value = '';
        document.getElementById('hasil-cari-murid').innerHTML = '';
      }

      function tunjukFormTambah() {
        document.getElementById('form-tambah')
                .style.display = 'block';
        muatSenaraiMuridPencapaian();
        document.getElementById('form-tambah')
                .scrollIntoView({ behavior: 'smooth' });
      }

      function batalFormTambah() {
        document.getElementById('form-tambah')
                .style.display = 'none';
        batalPilihMurid();
      }

      function simpanPencapaian() {
        const nama = document.getElementById('tambah-nama')
                             .value.trim();
        const peringkat = document.getElementById('tambah-peringkat')
                                  .value;
        const tempat = document.getElementById('tambah-tempat').value;
        const tarikh = document.getElementById('tambah-tarikh').value;

        if (muridPencapaian.length === 0 || !nama ||
            !peringkat || !tempat || !tarikh) {
          tunjukToast('Sila lengkapkan maklumat wajib (*) ' +
            'termasuk sekurang-kurangnya seorang murid.',
            'ralat');
          return;
        }

        tunjukLoading(true);

        const data = {
          senaraiIC: muridPencapaian.map(m => m.ic),
          namaPertandingan: nama,
          kategori: document.getElementById('tambah-kategori').value,
          peringkat: peringkat,
          tempat: tempat,
          jenispenglibatan: document.getElementById(
            'tambah-penglibatan').value,
          tarikh: tarikh,
          guruPengiring: guruPencapaian.join(', '),
          idKelab: ''
        };

        google.script.run
          .withSuccessHandler(function(hasil) {
            tunjukLoading(false);
            if (hasil.berjaya) {
              tunjukToast('Pencapaian berjaya disimpan!', 'berjaya');
              batalFormTambah();
              muatPencapaian();
            } else {
              tunjukToast(hasil.mesej, 'ralat');
            }
          })
          .withFailureHandler(function() {
            tunjukLoading(false);
            tunjukToast('Pencapaian tidak dapat disimpan. Cuba lagi.', 'ralat');
          })
          .tambahPencapaian(data, sessionStorage.getItem('token'));
      }

      function padamPencapaian(id, nama) {
        if (!confirm(`Padam pencapaian untuk ${nama}?`)) return;

        tunjukLoading(true);
        google.script.run
          .withSuccessHandler(function(hasil) {
            tunjukLoading(false);
            if (hasil.berjaya) {
              tunjukToast('Rekod dipadam.', 'berjaya');
              muatPencapaian();
            } else {
              tunjukToast(hasil.mesej, 'ralat');
            }
          })
          .withFailureHandler(function() {
            tunjukLoading(false);
            tunjukToast('Rekod tidak dapat dipadam. Cuba lagi.', 'ralat');
          })
          .padamPencapaian(id, sessionStorage.getItem('token'));
      }

    </script>

  </body>
</html>
